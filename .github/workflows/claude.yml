name: Claude Code

# Mention @claude in an issue, a PR comment or a review and Claude Code answers there,
# working in a fresh checkout of this repository.
#
# It authenticates with the Claude subscription, not an API key: CLAUDE_CODE_OAUTH_TOKEN
# comes from `claude setup-token`. Every run draws on the same weekly quota as the desktop
# app, so a long @claude task costs exactly what it would cost locally.
#
# The checkout has no CLAUDE.md and no docs/, because both are gitignored. Claude here
# knows only what the repository itself says.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on a PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
