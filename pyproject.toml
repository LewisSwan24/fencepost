# Vercel's Python builder reads this file with uv: [tool.vercel] names the entrypoint
# and [project].dependencies decides what gets installed. It ignores requirements.txt.
[project]
name = "fencepost"
version = "0.1.0"
requires-python = ">=3.12"
# libsql is imported only when the address is libsql:// (see proxy/store.py), but it still
# has to be installed into the function, or the hosted path fails with ImportError the
# moment it is used. Use the official package, not the deprecated libsql-client.
dependencies = ["openai==3.13.0", "libsql==0.1.11"]

[tool.uv]
package = false          # an application, not a library; uv should not try to build it

[tool.vercel]
entrypoint = "api.index:handler"
