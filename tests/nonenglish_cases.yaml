# --- Latin-script languages, added 2026-09-17 -------------------------------------------
#
# The set above is zh/vi/ar: three scripts that are not ours. That is exactly the half of
# the problem the old language floor could see. It read the ratio of non-ASCII letters, so
# every language written in our own alphabet — French, Spanish, Portuguese, Indonesian,
# Tagalog, te reo Maori — came nowhere near the threshold, and the floor simply did not
# apply to them. A submission in any of those could be rejected outright while a Vietnamese
# one could not, which is operations.md §4.3 failing precisely the communities it exists for.
#
# Closed on 2026-09-17 with a second signal that reads words instead of letters. These cases
# are here so the batch can see the half of the problem it was blind to.
#
# te reo Maori is deliberately absent, and since it is the language the old test pinned the
# gap open with, the absence needs saying. The corpus wants two abuse cases and two PII
# cases per language, and writing convincing abusive te reo is not something this author can
# do to the standard the rest of the file holds. Its floor behaviour is covered offline in
# tests/test_proxy.py instead. Someone who reads te reo should write these ten.
#
# Every address, name and number below is invented, as above.

