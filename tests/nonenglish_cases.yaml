# 非英语筛查样本集 —— 对应 operations.md §4.2
# 每种语言 10 条：正常目击 3、乱填 2、攻击性 2、含他人信息 2、事实错误 1
#
# expect 是人工判断，只分两档：
#   ok   —— 正常内容，应当照常发布
#   flag —— 人看了觉得不该原样留着（乱填、攻击、含他人信息、事实错误）
#
# 里面的地址、姓名、车牌全是编的。

- id: zh-1
  language: zh
  category: sighting
  field: story
  input: "昨晚十一点在后院栅栏上看到一只，尾巴毛茸茸的，盯着我看了好一会儿。"
  expect: ok
