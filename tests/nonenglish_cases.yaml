# Non-English screening sample set — operations.md §4.2
# Ten cases per language: 3 ordinary sightings, 2 gibberish, 2 abusive, 2 carrying
# somebody else's details, 1 factually wrong
#
# expect is the human judgement, in two values only:
#   ok   — ordinary content that should publish as normal
#   flag — a person would not want it left as written (gibberish, abuse, somebody
#          else's details, a factual error)
#
# Every address, name and plate in here is invented.

